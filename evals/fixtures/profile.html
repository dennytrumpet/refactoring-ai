<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian profile</title>
<style>
:root { --brand: #71401d; --ink: #222; --space: 10px; --radius: 10px; --body: 15px; }
body { font: var(--body)/1.5 system-ui, sans-serif; color: var(--ink); margin: 0; padding: 20px; background: #fff; }
form { max-width: 430px; display: grid; gap: 20px; }
label { display: grid; gap: var(--space); }
input, button { font: inherit; border-radius: var(--radius); padding: var(--space); }
input { border: 1px solid #777; }
button { background: var(--brand); color: #fff; border: 0; justify-self: start; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
</style>
<h1>Edit profile</h1>
<form action="/profile" method="post">
<label>Display name <input name="display_name" autocomplete="nickname"></label>
<button type="submit">Save profile</button>
</form>
</html>
