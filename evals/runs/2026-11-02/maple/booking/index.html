<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian booking</title>
<style>
body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #222; }
form { width: 100%; max-width: 600px; display: grid; gap: 24px; }
p { font-size: 20px; font-weight: 400; color: #222; background: #eee; padding: 16px; }
.row { display: grid; gap: 8px; min-width: 0; }
label, button { overflow-wrap: anywhere; }
input, button { box-sizing: border-box; min-width: 0; max-width: 100%; font: inherit; padding: 8px 12px; }
input { width: 100%; }
button { justify-self: start; white-space: normal; text-align: start; }
:focus-visible { outline: 2px solid #222; outline-offset: 3px; }
</style>
<h1>Book a workshop</h1>
<p>Choose the date that works for your team.</p>
<form action="/bookings" method="post">
<div class="row"><label for="starts-at">Your preferred workshop date and starting time</label><input id="starts-at" name="starts_at" type="datetime-local"></div>
<button type="submit">Request a workshop for everyone in your department</button>
</form>
</html>
